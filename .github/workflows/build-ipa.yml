name: Build Location Spoofer Pro IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package IPA
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Show Xcode Info
        run: |
          xcode-select -p
          xcodebuild -version
          echo "---"
          xcodebuild -list -project LocationSpooferPro.xcodeproj 2>&1 || true

      - name: Build App with Xcodebuild
        run: |
          mkdir -p build
          set -o pipefail
          xcodebuild build \
            -project LocationSpooferPro.xcodeproj \
            -scheme LocationSpooferPro \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
          2>&1 | tee build/build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          if [ $BUILD_EXIT -ne 0 ]; then
            echo ""
            echo "==== BUILD ERRORS ===="
            grep -E "error:|warning:|note:" build/build.log | tail -60
            exit $BUILD_EXIT
          fi

      - name: Upload Build Log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build/build.log

      - name: Package App into IPA
        run: |
          APP_PATH=$(find build/DerivedData -name "*.app" -not -path "*/iphonesimulator/*" | head -1)
          echo "App found at: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r LocationSpooferPro.ipa Payload
          rm -rf Payload
          ls -lh LocationSpooferPro.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocationSpooferPro-IPA
          path: LocationSpooferPro.ipa
          retention-days: 30
